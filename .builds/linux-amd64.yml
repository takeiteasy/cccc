image: ubuntu/lts
packages:
  - clang
  - make
  - pkg-config
  - libffi-dev
  - python3
sources:
  - https://git.sr.ht/~takeiteasy/cccc
environment:
  CC: clang
tasks:
  - bootstrap: |
      # Stage0 invariant (#842): a plain `make` with only a system cc and
      # libffi must produce a working compiler. On a fresh clone (no
      # src/std.c, gitignored) it links against src/std_stub.c instead --
      # a stand-in whose embedded-header table is empty; the private headers
      # (reflection.h/testing.h/building.h) it needs are found on disk via
      # -I./include instead. `make bootstrap` (#857) finishes the
      # bootstrap: regenerate the real src/std.c, then unconditionally
      # relink against it (a plain second `make cccc` is subject to an
      # mtime race and can silently skip the relink -- see the Makefile's
      # `bootstrap` target for the full explanation). From this point on,
      # ./cccc --build build.c's own two-pass regen is a no-op (src/std.c
      # already matches disk) and stays that way for the rest of the job.
      cd cccc
      set -e
      make bootstrap
  - build: |
      # Two-pass build (#571/#842): regenerates src/std.c from
      # tools/generate_stdlib.c, then rebuilds the real cccc against it.
      # This is also the enforcement point for "developers never run
      # `make stdlib`" -- CI always does the regen itself.
      cd cccc
      set -e
      ./cccc --build build.c
  - test: |
      # Aggregate driver: source suite, .c4 bytecode round-trip,
      # audit_ffi, and sqlite_smoke (skips cleanly -- the amalgamation
      # zip is not committed to the repo) all in one run, against the
      # build.c-produced (not the stage0 bootstrap) binary.
      cd cccc
      set -e
      python3 tools/run_tests.py --binary build/cccc -j 8
