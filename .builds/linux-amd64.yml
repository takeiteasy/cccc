image: ubuntu/lts
packages:
  - clang
  - gcc
  - make
  - pkg-config
  - libffi-dev
  - libgdbm-compat-dev
  - python3
sources:
  - https://git.sr.ht/~takeiteasy/cccc
environment:
  # #1186: CC only selects the compiler for the stage0 Makefile's `make
  # bootstrap`/`make cccc` (clang, here). It has no bearing on either of
  # `./cccc --build`'s own two internal compiler probes -- CCCC_BUILD_CC
  # (compiles/links --build targets, i.e. this job's own `./cccc --build
  # build.c` below) and CCCC_NATIVE_CC (the SEPARATE probe -c=native hands
  # its generated C to, exercised by the native test pass
  # suite) -- split into two env vars by #1198, previously one conflated
  # CCCC_NATIVE_CC. Both are deliberately left unpinned here rather than
  # set to match CC: this image's `cc` resolves to distro gcc, and gcc's
  # own presence in `packages` above (added by #1186) is only to make its
  # version legible in the job log, not to force it -- an unpinned gcc
  # alongside clang is exactly what caught the FTS/DIR/DBM opaque-handle
  # bug (#1186) in the first place, and the native suite's skip tables are
  # now keyed by compiler family (NATIVE_SKIP_TESTS_CLANG/_GCC,
  # tools/testing/__init__.py) specifically so both sides of this split
  # stay covered instead of being flattened to one.
  CC: clang
tasks:
  - build: |
      # One pass: `make` builds ./cccc, the only compiler binary.
      cd cccc
      set -e
      git submodule update --init
      make
  - test: |
      # Every suite in VM and -c=native mode, as one build graph
      cd cccc
      set -e
      ./cccc --build build.c --build-target=test --build-jobs=8 --build-keep-going
      # No `docs` task here (dropped): sr.ht's ubuntu/lts image
      # started shipping a doxygen version that hangs -- not just warns --
      # when graphviz's `dot` binary is absent (never installed here; it's
      # only an apt-suggested package, not a dependency), timing out every
      # job's docs step (first seen ~2026-08-07, unrelated to any commit --
      # bisected against a commit that only touched unrelated source).
      # `./cccc --build build.c --build-target=docs` still works locally
      # for anyone with doxygen+graphviz installed; the completeness gate
      # (WARN_AS_ERROR) just isn't enforced by this CI manifest anymore.
