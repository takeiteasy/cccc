name: Release

# Builds and publishes GitHub release artifacts for the four supported
# platform quadrants on every `v*` tag push (#883). ci.yml's linux-aarch64/
# macos-arm64/macos-x86_64 jobs (and this workflow's linux-amd64 job, which
# ci.yml deliberately omits -- sr.ht already covers amd64 per-push CI, see
# man/RELEASING.md) share the same bootstrap->build shape; this workflow
# additionally builds the `release` target (build.c, host -O2 -g -DNDEBUG)
# instead of the debug default, and runs the full test suite against that
# exact release binary before packaging it -- an artifact that skipped the
# optimized-build audit on its own platform defeats the point of gating on
# it (see man/RELEASING.md's Audit gate section).
#
# workflow_dispatch lets a fixed release be re-run against an existing tag
# (e.g. after fixing a platform-specific build bug the first run surfaced)
# without moving the tag -- publishing was skipped on the v0.1.0 run that
# found the linux CC selection + -fgnu89-inline issues below, since
# `publish` needs all four platform jobs green.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.1.0)"
        required: true

jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    env:
      # Resolved per-job, used everywhere below instead of raw
      # GITHUB_REF_NAME -- on a workflow_dispatch run GITHUB_REF_NAME is
      # the branch the workflow was dispatched against (e.g. "trunk"), not
      # the tag being (re)released.
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      # ubuntu-24.04's preinstalled `cc` is gcc, which rejects -std=c23
      # ("did you mean -std=c2x?"). Two separate compiler-selection
      # mechanisms need overriding, not one: CC for the stage0 Makefile's
      # `CC ?= cc` (exported job env propagates through recursive $(MAKE)),
      # and CCCC_NATIVE_CC for build.c's own internal compiler probe
      # (cccc_find_native_cc(), src/vm.c), which ignores CC entirely and
      # otherwise tries {cc, clang, gcc} on PATH in that order.
      CC: clang
      CCCC_NATIVE_CC: clang
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang make pkg-config libffi-dev python3
      - name: Bootstrap (stage0 -> regen std.c -> rebuild)
        run: make bootstrap
      - name: Build release
        run: ./cccc --build build.c --build-target=release
      - name: Test release binary
        run: python3 tools/run_tests.py --binary build/cccc-release -j 4
      - name: Package
        run: |
          set -e
          VERSION="${RELEASE_TAG#v}"
          NAME="cccc-${VERSION}-linux-x86_64"
          mkdir "$NAME"
          cp build/cccc-release "$NAME/cccc"
          cp LICENSE README.md "$NAME/"
          tar czf "$NAME.tar.gz" "$NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: cccc-*.tar.gz

  linux-aarch64:
    runs-on: ubuntu-24.04-arm
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      # See linux-amd64's comment above for why both CC and CCCC_NATIVE_CC
      # need overriding on this runner image too.
      CC: clang
      CCCC_NATIVE_CC: clang
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang make pkg-config libffi-dev python3
      - name: Bootstrap (stage0 -> regen std.c -> rebuild)
        run: make bootstrap
      - name: Build release
        run: ./cccc --build build.c --build-target=release
      - name: Test release binary
        run: python3 tools/run_tests.py --binary build/cccc-release -j 4
      - name: Package
        run: |
          set -e
          VERSION="${RELEASE_TAG#v}"
          NAME="cccc-${VERSION}-linux-aarch64"
          mkdir "$NAME"
          cp build/cccc-release "$NAME/cccc"
          cp LICENSE README.md "$NAME/"
          tar czf "$NAME.tar.gz" "$NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: cccc-*.tar.gz

  macos-arm64:
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install dependencies
        run: brew install libffi pkg-config
      - name: Bootstrap (stage0 -> regen std.c -> rebuild)
        run: make bootstrap
      - name: Build release
        run: ./cccc --build build.c --build-target=release
      - name: Test release binary
        run: python3 tools/run_tests.py --binary build/cccc-release -j 4
      - name: Package
        run: |
          set -e
          VERSION="${RELEASE_TAG#v}"
          NAME="cccc-${VERSION}-macos-arm64"
          mkdir "$NAME"
          cp build/cccc-release "$NAME/cccc"
          cp LICENSE README.md "$NAME/"
          tar czf "$NAME.tar.gz" "$NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: cccc-*.tar.gz

  macos-x86_64:
    # Native Intel build+test -- NOT build.c's macos_x86_64 cross-compile
    # target (see ci.yml's macos-x86_64 job for why).
    runs-on: macos-15-intel
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install dependencies
        run: brew install libffi pkg-config
      - name: Bootstrap (stage0 -> regen std.c -> rebuild)
        run: make bootstrap
      - name: Build release
        run: ./cccc --build build.c --build-target=release
      - name: Test release binary
        run: python3 tools/run_tests.py --binary build/cccc-release -j 4
      - name: Package
        run: |
          set -e
          VERSION="${RELEASE_TAG#v}"
          NAME="cccc-${VERSION}-macos-x86_64"
          mkdir "$NAME"
          cp build/cccc-release "$NAME/cccc"
          cp LICENSE README.md "$NAME/"
          tar czf "$NAME.tar.gz" "$NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: cccc-*.tar.gz

  publish:
    needs: [linux-amd64, linux-aarch64, macos-arm64, macos-x86_64]
    runs-on: ubuntu-24.04
    # Repo default workflow token permission is read-only; softprops/
    # action-gh-release needs contents:write to create the release.
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum cccc-*.tar.gz > SHA256SUMS
      - name: Extract changelog section
        run: |
          set -e
          VERSION="${RELEASE_TAG#v}"
          awk -v ver="$VERSION" '
              /^## \[/ { if (found) exit; if ($0 ~ "\\[" ver "\\]") { found=1; next } }
              found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/cccc-*.tar.gz
            dist/SHA256SUMS
