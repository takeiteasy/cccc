name: Release

# Builds and publishes GitHub release artifacts for the four supported
# platform quadrants on every `v*` tag push (#883). ci.yml's linux-aarch64/
# macos-arm64/macos-x86_64 jobs (and this workflow's linux-amd64 job, which
# ci.yml deliberately omits -- sr.ht already covers amd64 per-push CI, see
# man/RELEASING.md) share the same bootstrap->build shape; this workflow
# additionally builds the `release` target (build.c, host -O2 -g -DNDEBUG)
# instead of the debug default, and runs the full test suite against that
# exact release binary before packaging it -- an artifact that skipped the
# optimized-build audit on its own platform defeats the point of gating on
# it (see man/RELEASING.md's Audit gate section).
on:
  push:
    tags: ["v*"]

jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang make pkg-config libffi-dev python3
      - name: Bootstrap (stage0 -> regen std.c -> rebuild)
        run: make bootstrap
      - name: Build release
        run: ./cccc --build build.c --build-target=release
      - name: Test release binary
        run: python3 tools/run_tests.py --binary build/cccc-release -j 4
      - name: Package
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="cccc-${VERSION}-linux-x86_64"
          mkdir "$NAME"
          cp build/cccc-release "$NAME/cccc"
          cp LICENSE README.md "$NAME/"
          tar czf "$NAME.tar.gz" "$NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: cccc-*.tar.gz

  linux-aarch64:
    runs-on: ubuntu-24.04-arm
    env:
      # See ci.yml's linux-aarch64 job for why both CC and CCCC_NATIVE_CC
      # need overriding on this runner image.
      CC: clang
      CCCC_NATIVE_CC: clang
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang make pkg-config libffi-dev python3
      - name: Bootstrap (stage0 -> regen std.c -> rebuild)
        run: make bootstrap
      - name: Build release
        run: ./cccc --build build.c --build-target=release
      - name: Test release binary
        run: python3 tools/run_tests.py --binary build/cccc-release -j 4
      - name: Package
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="cccc-${VERSION}-linux-aarch64"
          mkdir "$NAME"
          cp build/cccc-release "$NAME/cccc"
          cp LICENSE README.md "$NAME/"
          tar czf "$NAME.tar.gz" "$NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: cccc-*.tar.gz

  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install libffi pkg-config
      - name: Bootstrap (stage0 -> regen std.c -> rebuild)
        run: make bootstrap
      - name: Build release
        run: ./cccc --build build.c --build-target=release
      - name: Test release binary
        run: python3 tools/run_tests.py --binary build/cccc-release -j 4
      - name: Package
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="cccc-${VERSION}-macos-arm64"
          mkdir "$NAME"
          cp build/cccc-release "$NAME/cccc"
          cp LICENSE README.md "$NAME/"
          tar czf "$NAME.tar.gz" "$NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: cccc-*.tar.gz

  macos-x86_64:
    # Native Intel build+test -- NOT build.c's macos_x86_64 cross-compile
    # target (see ci.yml's macos-x86_64 job for why).
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install libffi pkg-config
      - name: Bootstrap (stage0 -> regen std.c -> rebuild)
        run: make bootstrap
      - name: Build release
        run: ./cccc --build build.c --build-target=release
      - name: Test release binary
        run: python3 tools/run_tests.py --binary build/cccc-release -j 4
      - name: Package
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="cccc-${VERSION}-macos-x86_64"
          mkdir "$NAME"
          cp build/cccc-release "$NAME/cccc"
          cp LICENSE README.md "$NAME/"
          tar czf "$NAME.tar.gz" "$NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: cccc-*.tar.gz

  publish:
    needs: [linux-amd64, linux-aarch64, macos-arm64, macos-x86_64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum cccc-*.tar.gz > SHA256SUMS
      - name: Extract changelog section
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
              /^## \[/ { if (found) exit; if ($0 ~ "\\[" ver "\\]") { found=1; next } }
              found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/cccc-*.tar.gz
            dist/SHA256SUMS
