# Runs the --sandbox host test on native x86-64 Linux, the only place the x32
# seccomp rule can be exercised (Rosetta containers reject seccomp). Manual
# only: it needs a build of ./cccc, so it is not run on every push.

name: Sandbox x86-64

on:
  workflow_dispatch:

concurrency:
  group: sandbox-x86-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sandbox:
    runs-on: ubuntu-24.04
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang make pkg-config libffi-dev
      - name: Kernel sandbox support
        run: |
          uname -r
          cat /sys/kernel/security/lsm || true
      - name: Build ./cccc
        run: make
      - name: Run test_sandbox
        timeout-minutes: 10
        run: |
          clang -o test_sandbox tests/host/test_sandbox.c
          CCCC_BIN=./cccc ./test_sandbox | tee sandbox.log
          grep -q '^PASS: sandbox' sandbox.log
