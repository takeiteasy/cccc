name: Docs

# The Doxygen docs build is not run on ordinary pushes (see CLAUDE.md's
# Branching notes): it builds the HTML for the public headers under
# include/cccc/, checks the doc links and publishes to GitHub Pages
# (https://takeiteasy.github.io/cccc/) on a `v*` tag push (a release) or by
# hand (Actions > Docs > Run workflow). sr.ht's .builds/linux-amd64.yml
# builds and tests the compiler on every push; this workflow needs no `cccc`
# binary, since Doxyfile's INPUT is just the public headers and `doxygen
# Doxyfile` runs standalone. WARN_AS_ERROR in Doxyfile makes it a completeness
# gate on @param/@return coverage.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check doc links
        run: cc -O1 -o /tmp/doclinks tools/doclinks.c && /tmp/doclinks
      - name: Install doxygen + graphviz
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz
      - name: Build Doxygen HTML
        run: mkdir -p build/docs && doxygen Doxyfile
      - name: Disable Jekyll processing
        # Doxygen's output has underscore-prefixed files/dirs (e.g. search
        # assets) that GitHub Pages' default Jekyll processing excludes,
        # silently breaking the published site unless this is present.
        run: touch build/docs/html/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs/html

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
