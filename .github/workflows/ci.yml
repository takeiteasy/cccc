name: Docs

# GitHub-side "regular push" CI is docs-only (see CLAUDE.md's Branching
# notes): builds the Doxygen HTML for the three public headers under
# include/cccc/ and publishes it to GitHub Pages
# (https://takeiteasy.github.io/cccc/) on every push to `trunk`. `trunk` is
# pushed to both `origin` (sr.ht) and `github` on every push to keep them
# in sync -- sr.ht's .builds/linux-amd64.yml is what actually
# bootstraps/builds/tests the compiler on every push (Linux amd64,
# canonical); this workflow doesn't need a working `cccc` binary at all,
# since Doxyfile's INPUT is just the three headers and `doxygen Doxyfile`
# runs standalone.
#
# The full build+test+package for the three supported quadrants (Linux
# amd64/aarch64, macOS arm64) only runs at release time, via
# .github/workflows/release.yml (triggered by a `v*` tag push) -- not on
# every push. See CLAUDE.md's Branching notes.
#
# pull_request builds (WARN_AS_ERROR in Doxyfile makes this a real
# completeness gate on @param/@return coverage) but never deploys -- a PR
# from a fork has no permission to publish Pages, and an unmerged PR's docs
# shouldn't go live anyway.
on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install doxygen + graphviz
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz
      - name: Build Doxygen HTML
        run: mkdir -p build/docs && doxygen Doxyfile
      - name: Disable Jekyll processing
        # Doxygen's output has underscore-prefixed files/dirs (e.g. search
        # assets) that GitHub Pages' default Jekyll processing excludes,
        # silently breaking the published site unless this is present.
        run: touch build/docs/html/.nojekyll
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/trunk' && github.event_name == 'push'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/trunk' && github.event_name == 'push'
        with:
          path: build/docs/html

  deploy:
    needs: build
    if: github.ref == 'refs/heads/trunk' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
