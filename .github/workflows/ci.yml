name: CI

# Mirror CI (#849): builds.sr.ht (.builds/linux-amd64.yml) cannot run
# arm64/aarch64 on any image -- confirmed against the raw compatibility
# matrix (every arch: arm64/aarch64 cell is empty) and empirically (three
# different images all failed identically with "Image .. is not available
# for arch .arm64."). sr.ht stays the canonical Linux amd64 CI; this
# workflow closes the three remaining release-target quadrants using
# GitHub-hosted runners: Linux aarch64, macOS arm64, macOS x86_64.
#
# The mirror to this repo is a manual `git push github trunk` (see
# docs/TESTING.md's Continuous Integration section) -- no deploy key or PAT
# is stored anywhere, so this workflow only ever runs against whatever was
# last pushed here.
#
# Only trunk (release/CI-gated branch) triggers -- devel is a local-only
# working branch and is never pushed to either remote.
on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

jobs:
  linux-aarch64:
    runs-on: ubuntu-24.04-arm
    env:
      # Two separate compiler-selection mechanisms need overriding here,
      # not one:
      #  - CC: the stage0 `make bootstrap` target's recursive `make cccc`
      #    invocations use plain `CC ?= cc` in the Makefile, which a `CC`
      #    env var overrides per normal make semantics (exported job env
      #    propagates through recursive $(MAKE) automatically).
      #  - CCCC_NATIVE_CC: `./cccc --build build.c`'s own internal compiler
      #    probe (cccc_find_native_cc(), src/vm.c) is a *different* lookup
      #    that only honours CCCC_NATIVE_CC -- it ignores CC entirely and
      #    otherwise tries {cc, clang, gcc} on PATH in that order. sr.ht's
      #    minimal image only has clang installed (no cc/gcc), so that
      #    fallback happens to land on clang there; GitHub's ubuntu-24.04-arm
      #    runner ships a pre-installed `cc` (-> gcc), which wins first and
      #    breaks on `-std=c23` ("did you mean -std=c2x?").
      CC: clang
      CCCC_NATIVE_CC: clang
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang make pkg-config libffi-dev python3
      - name: Bootstrap (stage0 -> regen std.c -> rebuild)
        run: |
          set -e
          # `make bootstrap` (#857) does the full stage0 dance -- including
          # an unconditional relink after regen_stdlib.sh, so a fast CI
          # runner can't hit the mtime race where make's dependency check
          # sees src/std.c as not strictly newer than the just-linked
          # binary and wrongly reports "cccc is up to date" (see the
          # Makefile's `bootstrap` target for the full explanation).
          make bootstrap
      - name: Build
        run: ./cccc --build build.c
      - name: Test
        run: python3 tools/run_tests.py --binary build/cccc -j 4

  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install libffi pkg-config
      - name: Bootstrap (stage0 -> regen std.c -> rebuild)
        run: |
          set -e
          # `make bootstrap` (#857) does the full stage0 dance -- including
          # an unconditional relink after regen_stdlib.sh, so a fast CI
          # runner can't hit the mtime race where make's dependency check
          # sees src/std.c as not strictly newer than the just-linked
          # binary and wrongly reports "cccc is up to date" (see the
          # Makefile's `bootstrap` target for the full explanation).
          make bootstrap
      - name: Build
        run: ./cccc --build build.c
      - name: Test
        run: python3 tools/run_tests.py --binary build/cccc -j 4

  macos-x86_64:
    # Native Intel build+test -- NOT build.c's macos_x86_64 target, which is
    # a cross-compile-only target meant to run from an arm64 host (see its
    # comment in build.c); on a real Intel runner the plain bootstrap+build
    # path below already produces and runs a native x86_64 binary.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install libffi pkg-config
      - name: Bootstrap (stage0 -> regen std.c -> rebuild)
        run: |
          set -e
          # `make bootstrap` (#857) does the full stage0 dance -- including
          # an unconditional relink after regen_stdlib.sh, so a fast CI
          # runner can't hit the mtime race where make's dependency check
          # sees src/std.c as not strictly newer than the just-linked
          # binary and wrongly reports "cccc is up to date" (see the
          # Makefile's `bootstrap` target for the full explanation).
          make bootstrap
      - name: Build
        run: ./cccc --build build.c
      - name: Test
        run: python3 tools/run_tests.py --binary build/cccc -j 4
